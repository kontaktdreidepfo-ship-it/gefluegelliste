<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geflügelliste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#23603a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Geflügelliste</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
/* Hofladen-Werkzeug im Stil eines Waagen-Etiketts: grüne Kopfzeile, Tab-Leiste unten,
   Kacheln mit großen schmalen Zahlen für „noch frei“, Eigelb als einziger Akzent */
:root{
  --bg:#f1f3ee; --card:#fff; --field:#fff; --soft:#e8ece3; --ink:#17221a; --mute:#5b675d; --line:#dde3d7; --fieldline:#c4ccbd;
  --green:#23603a; --green-ink:#1d5232; --ongreen:#fff; --greenbg:#e1efe4;
  --yolk:#f3b52f; --yolkbg:#fdf1d2; --yolkink:#7a5200;
  --red:#b3261e; --redbg:#fbe4e1; --redline:#e8bdb8; --amber:#9a5a00; --amberbg:#fcefd4;
  --av1:#dce9f5; --av1i:#2b4f73; --av2:#f6e0e4; --av2i:#7a2e40; --av3:#e9e4f5; --av3i:#4a3a78;
  --shadow:0 1px 2px rgba(23,34,26,.05),0 6px 18px rgba(23,34,26,.06);
  --scrim:rgba(14,20,16,.5);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1410; --card:#172019; --field:#1e2820; --soft:#223025; --ink:#e6eee5; --mute:#9fae9f; --line:#2a372c; --fieldline:#3a4a3c;
  --green:#2f7a4a; --green-ink:#8fd3a5; --ongreen:#fff; --greenbg:#1b3324;
  --yolk:#f3b52f; --yolkbg:#3a2e12; --yolkink:#f3c862;
  --red:#ff8a7f; --redbg:#3b1d1a; --redline:#6b2f29; --amber:#f0b04a; --amberbg:#3a2c12;
  --av1:#1f3346; --av1i:#a9cdef; --av2:#41232b; --av2i:#f0b4c2; --av3:#2d2645; --av3i:#c9bdf0;
  --shadow:none; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1410; --card:#172019; --field:#1e2820; --soft:#223025; --ink:#e6eee5; --mute:#9fae9f; --line:#2a372c; --fieldline:#3a4a3c;
  --green:#2f7a4a; --green-ink:#8fd3a5; --ongreen:#fff; --greenbg:#1b3324;
  --yolk:#f3b52f; --yolkbg:#3a2e12; --yolkink:#f3c862;
  --red:#ff8a7f; --redbg:#3b1d1a; --redline:#6b2f29; --amber:#f0b04a; --amberbg:#3a2c12;
  --av1:#1f3346; --av1i:#a9cdef; --av2:#41232b; --av2i:#f0b4c2; --av3:#2d2645; --av3i:#c9bdf0;
  --shadow:none; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}

/* Kopfzeile */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--ongreen);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .top{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px}
header .mark{width:26px;height:26px;flex:none}
header h1{font:700 26px/1 var(--f-display);letter-spacing:.01em;margin:0}
.sync{margin-left:auto;font-size:13px;font-weight:600;border-radius:999px;padding:4px 11px;background:rgba(255,255,255,.14);color:var(--ongreen);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#cfd8cc;vertical-align:1px}
.sync.live::before{background:#7ee08f}
.sync.loading::before{background:var(--yolk)}
.sync.error::before{background:#ff8a7f}

/* Tab-Leiste unten */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabbar button{position:relative;background:none;border:0;color:var(--mute);font:600 12px/1.2 var(--f-body);padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabbar svg{width:25px;height:25px}
nav.tabbar button.on{color:var(--green-ink)}
nav.tabbar button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--yolk)}

main{max-width:1000px;margin:0 auto;padding-top:18px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Typografie */
h2{font:700 30px/1.05 var(--f-display);margin:0;text-wrap:balance}
h3{font:700 20px/1.1 var(--f-display);margin:22px 0 10px;letter-spacing:.01em}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.phead .sub{color:var(--mute);font-size:15px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute);font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* Flächen */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);min-width:0}
.banner{border-color:var(--yolk);background:var(--yolkbg)}
.empty{text-align:center;color:var(--mute);padding:36px 14px}
.empty svg{width:44px;height:44px;color:var(--fieldline);display:block;margin:0 auto 10px}
.warn{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:600}

/* Knöpfe & Chips */
button.b{font:600 16px var(--f-body);border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:12px;padding:11px 16px;min-height:46px;cursor:pointer;transition:transform .08s}
button.b:active,.chip:active{transform:scale(.97)}
button.b.pri{background:var(--green);border-color:var(--green);color:var(--ongreen)}
button.b.dan{color:var(--red);border-color:var(--redline);background:transparent}
button.b.sm{padding:6px 13px;min-height:38px;font-size:15px}
.big{font-size:19px;padding:14px 24px;min-height:56px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font:600 15px var(--f-body);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--green-ink)}
.tag{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.tag.res{background:var(--amberbg);color:var(--amber)}
.tag.sold{background:var(--greenbg);color:var(--green-ink)}

/* Tabellen */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.scroll table th,.scroll table td{white-space:nowrap}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}

/* Formulare */
input,select,textarea{font:17px var(--f-body);border:1px solid var(--fieldline);border-radius:12px;padding:10px 12px;min-height:46px;background:var(--field);color:var(--ink);width:100%}
input[type=number],input.num{text-align:right;font-variant-numeric:tabular-nums}
label{display:block;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.04em;margin:14px 0 5px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.chk{display:flex;gap:10px;align-items:center;margin:10px 0 0;color:var(--ink);font-size:16px;font-weight:500;letter-spacing:0}
.chk input{width:24px;height:24px;min-height:24px;accent-color:var(--green)}
.set td input,.set td select{padding:8px;min-height:42px}

/* Suche */
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap svg{position:absolute;left:15px;top:50%;width:22px;height:22px;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search{font-size:19px;padding:13px 14px 13px 46px;border-radius:14px;box-shadow:var(--shadow)}

/* Bestand: Kopf des Schlachttermins und Kacheln */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.hero .facts{grid-column:1/-1;display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
.hero .facts div{display:flex;flex-direction:column}
.hero .facts b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hero .facts span{font-size:13px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .t-name{font-weight:600;padding-right:4px}
.tile .t-num{font:700 46px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--green-ink);margin-top:4px}
.tile .t-num small{font-size:16px;font-weight:600;color:var(--mute);margin-left:4px;letter-spacing:.02em}
.tile .t-sub{font-size:13px;color:var(--mute)}
.tile .t-price{font-size:12px;color:var(--mute);font-weight:600}
.tile.zero .t-num{color:var(--amber)}
.tile.neg{border-color:var(--redline);background:var(--redbg)}
.tile.neg .t-num{color:var(--red)}
.tile.na .t-num{color:var(--fieldline)}
.meter{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:9px}
.meter i{display:block;height:100%;background:var(--green);border-radius:3px}
.tile.zero .meter i{background:var(--yolk)}
.tile.neg .meter i{background:var(--red)}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.part{background:var(--soft);border-radius:10px;padding:6px 11px;font-size:14px;font-variant-numeric:tabular-nums}
.part b{font-weight:700}
.part.neg{background:var(--redbg);color:var(--red);font-weight:600}

/* Bestellkarten (Bestand + Verkauf) */
.order{cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;transition:transform .08s}
.order:active{transform:scale(.99)}
.order .av{grid-row:span 2}
.order .name{font-weight:700;font-size:19px;line-height:1.2}
.order .meta{color:var(--mute);font-size:14px}
.order .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;grid-row:span 2}
.order .sum{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.order .items,.order .foot{grid-column:2/-1}
.order .foot{margin-top:8px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 21px/1 var(--f-display);background:var(--greenbg);color:var(--green-ink);flex:none}
.av.a1{background:var(--av1);color:var(--av1i)}
.av.a2{background:var(--av2);color:var(--av2i)}
.av.a3{background:var(--av3);color:var(--av3i)}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ic{display:inline-flex;gap:5px;align-items:baseline;background:var(--soft);border-radius:8px;padding:3px 9px;font-size:15px;line-height:1.35}
.ic b{font:700 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ic i{font-style:normal;color:var(--mute);font-size:13px}
.ic.note{background:var(--yolkbg);color:var(--yolkink);font-weight:600;font-size:14px}

/* Modale Fenster */
#modal{position:fixed;inset:0;background:var(--scrim);display:none;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
#modal.show{display:flex;flex-direction:column}
#dlg{position:fixed;inset:0;background:var(--scrim);display:none;z-index:30;padding-top:env(safe-area-inset-top,0px)}
#dlg.show{display:block}
.sheet{background:var(--bg);max-width:720px;margin:28px auto;border-radius:22px;padding:20px;width:calc(100% - 24px);animation:sheet-in .22s ease-out}
.sheet h2{margin-bottom:4px}
.dlg{max-width:440px;margin-top:18vh}
.dlg p{margin:0 0 12px;font-size:18px}
@keyframes sheet-in{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}button.b,.chip,.order{transition:none}}
.line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.l1{display:grid;grid-template-columns:1fr 72px 84px 112px 46px;gap:8px;align-items:center}
.lhead{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 13px 5px}
.lhead span:nth-child(n+2){text-align:right}

/* Ausgabe-Ansicht */
.sale-name{font:700 34px/1.05 var(--f-display);text-wrap:balance}
.sale-ordernote{background:var(--yolkbg);color:var(--yolkink);border-radius:12px;padding:9px 13px;margin-top:12px;font-weight:600}
.sale-line{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.sale-line:last-child{border-bottom:0}
.sale-q{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--green-ink)}
.sale-p{min-width:0}
.sale-p b{font-size:21px}
.sale-note{display:inline-block;margin-top:5px;background:var(--yolkbg);color:var(--yolkink);border-radius:8px;padding:2px 9px;font-weight:600;font-size:14px}
.sale-in{display:flex;gap:6px}
.sale-in input{width:96px}
.sale-done{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.sale-done span{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.sale-done b{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.w-progress{display:flex;align-items:center;gap:12px;margin:10px 0 14px;font-size:14px;color:var(--mute);font-weight:600}
.w-progress .meter{flex:1;margin:0;height:8px}
.w-order.done{border-color:var(--green)}
.w-order .w-sum{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.w-line{display:grid;grid-template-columns:minmax(0,1fr) 110px 92px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.w-line:last-child{border-bottom:0;padding-bottom:0}
.w-line input{font-size:19px}
.w-price{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.w-price.est{color:var(--mute);font-weight:500}
.ticket{border:2px dashed var(--fieldline);border-radius:16px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;background:var(--card)}
.ticket span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ticket b{font:700 42px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* Statistik */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat .card{margin:0;display:flex;flex-direction:column;gap:2px}
.stat .card>span:first-child{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.stat b{display:block;font:700 36px/1.05 var(--f-display);font-variant-numeric:tabular-nums}

.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px 20px;margin-top:18px}
.chart{min-width:0}
.chart .c-title{font-weight:700}
.chart svg{display:block;width:100%;height:auto;margin-top:4px;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mute);font:12px var(--f-body);font-variant-numeric:tabular-nums}
.chart .val{fill:var(--ink);font:700 13px var(--f-body)}
.chart .ln{fill:none;stroke:var(--green-ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--green-ink);stroke:var(--card);stroke-width:2}
.chart .br{fill:var(--green)}
.chart .hit{fill:transparent;cursor:pointer}
.chart rect.hit:hover{fill:rgba(127,127,127,.08)}
#tip{position:fixed;z-index:40;max-width:260px;background:var(--ink);color:var(--bg);padding:7px 11px;border-radius:9px;font-size:14px;line-height:1.35;pointer-events:none;box-shadow:var(--shadow)}
.chip.tk{border-color:var(--av1i);color:var(--av1i)}
.chip.tk.on{background:var(--av1i);color:var(--card);border-color:var(--av1i)}
@media(max-width:640px){.g2{grid-template-columns:1fr}th,td{padding:10px 5px}h2{font-size:27px}.tile .t-num{font-size:40px}}
@media(max-width:560px){
  .sheet{margin:auto 0 0;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--fieldline);margin:-6px auto 12px}
  .dlg{margin:auto 0 0}
  .sale-line{grid-template-columns:48px minmax(0,1fr)}.sale-in{grid-column:2/-1;min-width:0}.sale-in input{flex:1;width:auto;min-width:0}
  .l1{grid-template-columns:1fr 1fr 1.3fr 46px}.l1 select{grid-column:1/-1}.lhead{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .w-line{grid-template-columns:minmax(0,1fr) 96px}.w-line .w-what{grid-column:1/-1}.w-line input{grid-column:1}.w-price{grid-column:2}
  .sheet .big{flex-basis:100%;order:-1}
}
</style>
</head>
<body>
<header>
  <div class="top"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c4.2 0 7.8 6.4 7.8 11.3a7.8 7.8 0 0 1-15.6 0C4.2 8.6 7.8 2.2 12 2.2z" fill="#f3b52f"/><ellipse cx="9.4" cy="9" rx="1.6" ry="2.4" fill="#fff" opacity=".45"/></svg><h1>Geflügelliste</h1><span id="sync" class="sync local">Nur auf diesem Gerät</span></div>
</header>
<main id="app"></main>
<nav id="nav" class="tabbar" aria-label="Bereiche"></nav>
<div id="modal"></div>
<div id="dlg"></div>
<div id="tip" role="status" hidden></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
'use strict';
const KEY = 'gefluegel-v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

/* ---------- Standarddaten ---------- */
function seed() {
  const P = (id, name, uses, price = 0) => ({ id, name, uses, price, unit: 'kg', avgKg: 0 });
  return {
    version: 1,
    species: [
      {
        id: 'haehnchen', name: 'Hähnchen',
        parts: [
          { id: 'brust', name: 'Brust', perAnimal: 2 },
          { id: 'keule', name: 'Keule', perAnimal: 2 },
          { id: 'fluegel', name: 'Flügel', perAnimal: 2 },
          { id: 'karkasse', name: 'Karkasse', perAnimal: 1 },
          { id: 'innereien', name: 'Innereien', perAnimal: 1 }
        ],
        products: [
          P('ganz', 'Ganz', { brust: 2, keule: 2, fluegel: 2 }, 8),
          P('halb', 'Halb', { brust: 1, keule: 1, fluegel: 1 }, 8.5),

/* ---------- Speicher ---------- */
function load() {
  try { const j = localStorage.getItem(KEY); if (j) return normalize(JSON.parse(j)); } catch (e) {}
  return seed();
}
/* ältere Datenstände auf das aktuelle Format bringen */
function normalize(d) {
  if (!d.prices) addPriceList(d);
  d.marinade ??= 0.5;
  d.species.forEach(s => s.products.forEach(p => { p.unit ||= 'kg'; p.avgKg ||= 0; }));
  d.batches.forEach(b => { b.frozen ||= {}; b.orders.forEach(o => o.lines.forEach(l => { l.kg ??= ''; })); });
  d.freezerOut ||= [];
  return d;
}
/* Einmalig: Preisliste und neue Produkte/Tierarten in schon vorhandene Daten übernehmen,
   ohne selbst eingetragene Preise oder Namen zu überschreiben */
function addPriceList(d) {
  seed().species.forEach(ns => {
    const s = d.species.find(x => x.id === ns.id);
    if (!s) { d.species.push(ns); return; }
    const newParts = ns.parts.filter(np => !s.parts.some(p => p.id === np.id));
    s.parts.push(...newParts);
    ns.products.forEach(np => {
      const p = s.products.find(x => x.id === np.id);
      if (!p) { s.products.push(np); return; }
      if (!p.price) p.price = np.price;
      newParts.forEach(pt => { if (np.uses[pt.id]) p.uses[pt.id] = np.uses[pt.id]; });
    });
  });
  d.prices = 1;
}
/* ---------- Gemeinsame Datenbank ----------
   Auf claude.ai liegen die Daten in der Datenbank des Links: alle Geräte sehen dasselbe, live.
   Sonst (lokal geöffnet / als Home-Bildschirm-App) nur im Browser dieses Geräts.
   Aufbau: config/main (Tierarten, Produkte, Preise), customers/<id>, batches/<id>, orders/<id>.
   save() vergleicht den aktuellen Stand mit dem zuletzt bekannten und schreibt nur geänderte Dokumente. */
let DB = null, loaded = false, sync = 'local', syncMsg = '', pendingRender = false;
const COLLS = ['config', 'customers', 'batches', 'orders', 'freezer'];
const snaps = Object.fromEntries(COLLS.map(c => [c, null]));
const remote = new Map();   // Pfad -> JSON, wie in der Datenbank (bzw. gerade geschrieben)
const chains = new Map();   // Pfad -> laufender Schreibvorgang (pro Dokument immer nur einer)

/* JSON mit sortierten Schlüsseln, damit gleicher Inhalt immer gleich aussieht */
const stable = v => Array.isArray(v) ? '[' + v.map(stable).join(',') + ']'
  : v && typeof v === 'object' ? '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}'
  : JSON.stringify(v ?? null);

function docsOf(d) {
  const m = new Map();
  m.set('config/main', { species: d.species, marinade: d.marinade, prices: d.prices || 1 });
  d.customers.forEach(c => m.set('customers/' + c.id, { name: c.name }));
  d.batches.forEach(b => {
    const { orders, id, ...rest } = b;
    m.set('batches/' + id, rest);
    orders.forEach(o => { const { id: oid, ...ob } = o; m.set('orders/' + oid, { ...ob, batchId: id }); });
  });
  (d.freezerOut || []).forEach(e => { const { id, ...rest } = e; m.set('freezer/' + id, rest); });
  return m;
}
function buildState() {
  const clone = x => JSON.parse(JSON.stringify(x));
  const cfg = snaps.config.get('main');
  const d = { version: 1, ...(cfg ? clone(cfg) : { species: seed().species, marinade: 0.5, prices: 1 }), customers: [], batches: [] };
  snaps.customers.forEach((c, id) => d.customers.push({ id, name: c.name }));
  snaps.batches.forEach((b, id) => d.batches.push({ id, ...clone(b), orders: [] }));
  const orders = [...snaps.orders].sort((a, b) => (a[1].t || 0) - (b[1].t || 0));
  orders.forEach(([id, o]) => {
    const b = d.batches.find(x => x.id === o.batchId);
    if (b) { const { batchId, ...rest } = clone(o); b.orders.push({ id, ...rest }); }
  });
  d.freezerOut = [...snaps.freezer].map(([id, e]) => ({ id, ...clone(e) })).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  return normalize(d);
}

function save() {
  if (!DB) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} return; }
  if (!loaded) return;   // nie schreiben, bevor die gemeinsamen Daten da sind
  const docs = docsOf(S);
  docs.forEach((body, path) => {
    const j = stable(body);
    if (remote.get(path) !== j) { remote.set(path, j); writeDoc(path, body); }
  });
  [...remote.keys()].forEach(path => { if (!docs.has(path)) { remote.delete(path); writeDoc(path, null); } });
}
function writeDoc(path, body, retry = true) {
  const run = () => body === null ? DB.doc(path).delete() : DB.doc(path).set(JSON.parse(JSON.stringify(body)));
  const p = (chains.get(path) || Promise.resolve()).then(run).catch(async err => {
    if (retry && (!err?.code || err.code === 'unavailable')) {
      await new Promise(r => setTimeout(r, 500 + Math.random() * 1000));
      return run().catch(e => syncError(e));
    }
    syncError(err);
  });
  chains.set(path, p);
}
function syncError(err) {
  const c = err?.code;
  syncMsg = c === 'invalid_argument' ? 'Speichern nicht erlaubt: Du hast für diesen Link nur Leserechte. Der Besitzer muss dich als Mitwirkende/n freigeben.'
    : c === 'quota_exceeded' ? 'Die Datenbank ist voll. Bitte alte Schlachttermine löschen.'
    : c === 'revoked' ? 'Der Zugriff auf die gemeinsamen Daten wurde beendet. Bitte die Seite neu laden.'
    : 'Speichern hat nicht geklappt. Bitte Internetverbindung prüfen und die Seite neu laden.';
  setSync('error');
}
function setSync(s) { sync = s; drawSync(); scheduleRender(); }
function drawSync() {
  const t = { local: 'Nur auf diesem Gerät', loading: 'Lädt …', live: 'Alle Geräte verbunden', error: 'Fehler beim Speichern' }[sync];
  if ($('sync')) { $('sync').textContent = t; $('sync').className = 'sync ' + sync; }
}
/* Daten von außen nicht neu zeichnen, während jemand in ein Feld tippt */
function scheduleRender() {
  const a = document.activeElement;
  if (a && $('app').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) { pendingRender = true; return; }
  render();
}
async function initSync() {
  if (!window.claude?.use) return;
  const db = await window.claude.use('db');
  if (!db) return;
  DB = db; setSync('loading');
  COLLS.forEach(c => db.collection(c).onSnapshot(snap => {
    snaps[c] = new Map(snap.docs.map(d => [d.id, d.data()]));
    if (COLLS.some(x => !snaps[x])) return;
    remote.clear();
    COLLS.forEach(x => snaps[x].forEach((body, id) => remote.set(x + '/' + id, stable(body))));
    S = buildState();
    if (!loaded) { loaded = true; ui.batchId = null; }
    if (sync !== 'error') sync = 'live';
    drawSync(); scheduleRender();
  }, err => syncError(err)));
}

/* Daten aus der früheren Version (nur im Browser gespeichert) in die gemeinsamen Daten übernehmen */
function localLeftovers() {
  if (!DB || !loaded) return null;
  let L = null;
  try { if (localStorage.getItem(KEY + '-moved')) return null; L = JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
  if (!L || !L.batches || !L.customers) return null;
  const nb = L.batches.filter(b => !S.batches.some(x => x.id === b.id)).length;
  const nc = L.customers.filter(c => !S.customers.some(x => x.id === c.id || x.name.toLowerCase() === c.name.toLowerCase())).length;
  return nb || nc ? { L: normalize(L), nb, nc } : null;
}
function mergeLocal(L) {
  if (!snaps.config.get('main')) { S.species = L.species; S.marinade = L.marinade; }
  const idMap = {};
  L.customers.forEach(c => { idMap[c.id] = resolveCustomer(c.name); });
  L.batches.forEach(b => {
    if (S.batches.some(x => x.id === b.id)) return;
    b.orders.forEach((o, i) => { o.customerId = idMap[o.customerId] || o.customerId; o.t ??= Date.now() + i; });
    S.batches.push(b);
  });
  save();
  try { localStorage.setItem(KEY + '-moved', '1'); } catch (e) {}
}

let S = load();
let ui = { tab: 'verkauf', batchId: null, year: 'all', modal: null, q: '', saleBatch: 'all', saleDone: false };

/* ---------- Hilfsfunktionen ---------- */
const sp = id => S.species.find(s => s.id === id);
const cust = id => S.customers.find(c => c.id === id);
const batchOf = id => S.batches.find(b => b.id === id);
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('de-DE');
const eur = n => (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
function fmtAmt(n) {
  if (Number.isInteger(n)) return String(n);
  for (let d = 2; d <= 12; d++) { const x = n * d; if (Math.abs(x - Math.round(x)) < 1e-9 && Math.round(x) !== 0) return Math.round(x) + '/' + d; }
  return String(Math.round(n * 1000) / 1000).replace('.', ',');
}
function parseAmt(s) {
  s = String(s).trim().replace(',', '.');
  if (s.includes('/')) { const [a, b] = s.split('/'); return (+a) / (+b) || 0; }
  return +s || 0;
}
const parseNum = s => +String(s).trim().replace(',', '.') || 0;
const dateDE = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const today = () => new Date().toISOString().slice(0, 10);

/* Eigene Dialoge statt alert/confirm/prompt – die sind in eingebetteten Ansichten (z. B. claude.ai) gesperrt */
function dialog(text, { input = null, ok = 'OK', cancel = 'Abbrechen', danger = false } = {}) {

      <div class="row" style="margin-top:16px"><span class="sp"></span>${cancel ? `<button class="b" id="dlg_no">${cancel}</button>` : ''}<button class="b ${danger ? 'dan' : 'pri'}" id="dlg_ok">${ok}</button></div></div>`;
    el.classList.add('show');
    const inp = $('dlg_in');
    const done = yes => { const v = inp ? inp.value : true; el.classList.remove('show'); el.innerHTML = ''; res(yes ? v : (inp ? null : false)); };
    $('dlg_ok').onclick = () => done(true);
    if (cancel) $('dlg_no').onclick = () => done(false);

}
const say = t => dialog(t, { cancel: null });
const sure = t => dialog(t, { ok: 'Ja', danger: true });
const ask = (t, v = '') => dialog(t, { input: v });

/* Bestand eines Schlachttermins berechnen */
function calc(batch, orders = batch.orders, frozen = batch.frozen || {}) {
  const s = sp(batch.speciesId);
  const total = {}, used = {}, rem = {}, per = {}, avail = {}, util = {};
  s.parts.forEach(p => { total[p.id] = batch.count * p.perAnimal; used[p.id] = 0; });
  s.products.forEach(p => { per[p.id] = { res: 0, sold: 0, frozen: 0 }; });
  const use = (p, q) => { for (const k in p.uses) if (k in used) used[k] += q * p.uses[k]; };
  for (const pid in frozen) { const p = s.products.find(x => x.id === pid); if (p) { per[pid].frozen += +frozen[pid] || 0; use(p, +frozen[pid] || 0); } }
  orders.forEach(o => o.lines.forEach(l => {
    if (l.tk) return;
    const p = s.products.find(x => x.id === l.productId);
    if (!p) return;
    const q = +l.qty || 0;
    per[p.id][o.status === 'sold' ? 'sold' : 'res'] += q;
    use(p, q);
  }));
  s.parts.forEach(p => { rem[p.id] = total[p.id] - used[p.id]; });
  s.products.forEach(p => {
    const keys = Object.keys(p.uses).filter(k => k in rem && p.uses[k] > 0);
    avail[p.id] = keys.length ? Math.floor(Math.min(...keys.map(k => rem[k] / p.uses[k])) + 1e-9) : null;
    /* wie weit das knappste Teil dieses Produkts schon verplant ist (0–1) */
    util[p.id] = keys.length ? Math.max(...keys.map(k => total[k] ? used[k] / total[k] : 1)) : 0;
  });
  return { total, used, rem, per, avail, util };
}
/* Betrag einer Position: eingetragener Betrag > gewogenes Gewicht > Schätzung über Ø-Gewicht.
   est = true heißt geschätzt, none = true heißt kein Preis hinterlegt. */
function lineVal(l, s) {
  if (l.price !== '' && l.price != null) return { v: +l.price || 0, est: false };
  const p = prodOf(l, s);
  if (!p || !p.price) return { v: 0, est: false, none: true };
  const price = p.price + (l.mar ? +S.marinade || 0 : 0);
  if (p.unit === 'stk') return { v: price * (+l.qty || 0), est: false };
  if (l.kg !== '' && l.kg != null) return { v: price * (+l.kg || 0), est: false };
  if (p.avgKg) return { v: price * p.avgKg * (+l.qty || 0), est: true };
  return { v: 0, est: false, none: true };
}
const r2 = n => Math.round(n * 100) / 100;
/* Produkt einer Position – bei Tiefkühler-Ware (tk = Tierart) aus deren Produktliste */
const lineSp = (l, s) => l.tk ? sp(l.tk) || s : s;
const prodOf = (l, s) => lineSp(l, s).products.find(x => x.id === l.productId);
/* Muss diese Position noch gewogen werden? (kg-Ware ohne Gewicht und ohne festen Betrag) */
function needsKg(l, s) {
  const p = prodOf(l, s);
  return !!p && p.unit !== 'stk' && (l.price === '' || l.price == null) && (l.kg === '' || l.kg == null);
}
const kgLine = (l, s) => { const p = prodOf(l, s); return !!p && p.unit !== 'stk'; };
/* Gewicht eingeben: "1,6" oder einzelne Pakete "0,41+0,39+0,44" */
function parseKg(v) {
  const parts = String(v).split('+').map(x => x.trim()).filter(Boolean);
  if (!parts.length) return '';
  return Math.round(parts.reduce((a, x) => a + parseNum(x), 0) * 1000) / 1000;
}
const kgVal = v => v === '' || v == null ? '' : String(v).replace('.', ',');
function lineName(l, s) {
  const p = prodOf(l, s);
  if (!p) return l.text || 'Sonderwunsch';
  const ls = lineSp(l, s);
  return l.tk ? `❄ ${ls.id !== s.id ? ls.name + ' ' : ''}${p.name}` : p.name;
}
/* Tiefkühler-Bestand je Tierart+Produkt: eingefroren – reserviert/abgeholt – Eigenverbrauch.
   skipOrder/extra: für die Warnung im Bestell-Fenster (Entwurf statt gespeicherter Bestellung) */
function freezer(skipOrder = null, extra = null) {
  const m = new Map();
  const get = (sid, pid) => { const k = sid + ':' + pid; if (!m.has(k)) m.set(k, { sid, pid, in: 0, res: 0, sold: 0, out: 0 }); return m.get(k); };
  S.batches.forEach(b => {
    for (const pid in b.frozen || {}) if (+b.frozen[pid]) get(b.speciesId, pid).in += +b.frozen[pid];
    b.orders.forEach(o => { if (o.id !== skipOrder) o.lines.forEach(l => { if (l.tk) get(l.tk, l.productId)[o.status === 'sold' ? 'sold' : 'res'] += +l.qty || 0; }); });
  });
  if (extra) extra.lines.forEach(l => { if (l.tk) get(l.tk, l.productId).res += +l.qty || 0; });
  S.freezerOut.forEach(e => { get(e.speciesId, e.productId).out += +e.qty || 0; });
  m.forEach(x => { x.left = x.in - x.res - x.sold - x.out; x.sp = sp(x.sid); x.p = x.sp?.products.find(p => p.id === x.pid); });
  return [...m.values()].filter(x => x.sp && x.p);
}
function orderVal(o, s) {
  let v = 0, est = false;
  o.lines.forEach(l => { const x = lineVal(l, s); v += x.v; est ||= x.est; });
  return { v: r2(v), est };
}
const money = x => x.v ? (x.est ? '≈ ' : '') + eur(x.v) : '';
const unitLabel = p => p.unit === 'stk' ? 'Stück' : 'kg';

const noteText = l => [l.mar ? 'mariniert' : '', l.note].filter(Boolean).join(', ');
const batchLabel = b =>`${sp(b.speciesId).name} · ${dateDE(b.date)}`;
function lineText(l, s) {
  const p = prodOf(l, s);
  return `${fmt(+l.qty || 0)}× ${esc(lineName(l, s))}`;
}

/* Verkauf: Kunde kommt -> Namen suchen -> Bestellung antippen */
function viewVerkauf() {
  const withOpen = S.batches.filter(b => b.orders.some(o => o.status !== 'sold'))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (ui.saleBatch !== 'all' && !batchOf(ui.saleBatch)) ui.saleBatch = 'all';
  const chips = `<button class="chip ${ui.saleBatch === 'all' ? 'on' : ''}" data-a="salebatch" data-v="all">Alle Termine</button>` +
    withOpen.map(b => `<button class="chip ${ui.saleBatch === b.id ? 'on' : ''}" data-a="salebatch" data-v="${b.id}">${esc(batchLabel(b))}</button>`).join('');
  const list = [];
  S.batches.forEach(b => {
    if (ui.saleBatch !== 'all' && b.id !== ui.saleBatch) return;
    const s = sp(b.speciesId);
    b.orders.forEach(o => {
      if (o.status === 'sold' && !ui.saleDone) return;
      list.push({ b, s, o, name: cust(o.customerId)?.name || '?' });
    });
  });
  list.sort((x, y) => (x.o.status === 'sold') - (y.o.status === 'sold') || x.name.localeCompare(y.name, 'de'));
  const cards = list.map(({ b, s, o, name }) => `<div class="card order" data-a="sale" data-v="${b.id}:${o.id}" data-name="${esc(name.toLowerCase())}">
      ${avatar(name)}
      <span class="name">${esc(name)}</span>
      <span class="right">${o.status === 'sold' ? '<span class="tag sold">Abgeholt</span>' : `<span class="sum">${money(orderVal(o, s))}</span>`}</span>
      <span class="meta">${esc(batchLabel(b))}${o.lines.some(l => kgLine(l, s)) ? (o.lines.some(l => needsKg(l, s)) ? " · noch nicht gewogen" : " · gewogen ✓") : ""}</span>
      <div class="items">${itemChips(o, s)}</div>
    </div>`).join('');
  const open = list.filter(x => x.o.status !== 'sold').length;
  return `<div class="phead"><div><div class="eyebrow">Abholung</div><h2>Wer kommt?</h2></div><span class="sp"></span>
      <span class="sub">${open} offene Bestellung${open === 1 ? '' : 'en'}</span></div>
    <div class="searchwrap">${ICON.search}<input class="search" id="v_q" type="search" placeholder="Name suchen …" autocomplete="off" value="${esc(ui.q)}" aria-label="Kundenname suchen"></div>
    <div class="chips">${chips}<button class="chip ${ui.saleDone ? 'on' : ''}" data-a="saledone">${ui.saleDone ? '✓ ' : ''}Abgeholte zeigen</button></div>
    <div id="v_list">${cards || emptyBox('basket', 'Keine offenen Bestellungen.')}</div>
    <div id="v_none" hidden>${emptyBox('search', 'Niemand mit diesem Namen gefunden.')}</div>`;
}
function filterSale() {
  const q = ui.q.trim().toLowerCase(); let n = 0;
  document.querySelectorAll('#v_list [data-name]').forEach(el => { el.hidden = !!q && !el.dataset.name.includes(q); if (!el.hidden) n++; });
  if ($('v_none')) $('v_none').hidden = !q || n > 0;
}

/* Ausgabe-Ansicht: übersichtlich, was die Person bekommt; optional wiegen; dann abgeben */
function saleSheet(batchId, orderId) {
  const b = batchOf(batchId), o = b.orders.find(x => x.id === orderId);
  ui.modal = { type: 'order', sale: true, batchId, d: JSON.parse(JSON.stringify(o)), isNew: false };
  drawOrder();
}
function persistSale() {
  const m = ui.modal, b = batchOf(m.batchId), o = b?.orders.find(x => x.id === m.d.id);
  if (!o) return;
  o.lines = JSON.parse(JSON.stringify(m.d.lines));
  save(); render();
}
function drawSale() {
  const m = ui.modal, b = batchOf(m.batchId), s = sp(b.speciesId), d = m.d;
  const numVal = v => v === '' || v == null ? '' : String(v).replace('.', ',');
  const open = d.lines.some(l => needsKg(l, s));
  const lines = d.lines.map(l => {
    const p = prodOf(l, s);
    const edit = m.editAll || needsKg(l, s);
    const kg = p && p.unit !== 'stk' ? `<input class="num" type="text" inputmode="decimal" data-f="kg" value="${numVal(l.kg)}" placeholder="${+l.qty > 1 ? 'kg zus.' : 'kg'}" aria-label="Gewicht in kg${+l.qty > 1 ? ' für alle ' + fmt(+l.qty) + ' Stück' : ''}">` : '';
    const lv = lineVal(l, s);
    const done = `<div class="sale-done">${l.kg !== '' && l.kg != null ? `<span>${fmt(+l.kg)} kg</span>` : ''}<b>${lv.none ? '–' : (lv.est ? '≈ ' : '') + eur(lv.v)}</b></div>`;
    return `<div class="sale-line" data-l="${l.id}">
      <div class="sale-q">${fmt(+l.qty || 0)}×</div>
      <div class="sale-p"><b>${esc(lineName(l, s))}</b>${noteText(l) ? `<br><span class="sale-note">${esc(noteText(l))}</span>` : ''}</div>
      ${edit ? `<div class="sale-in">${kg}<input class="num" type="text" inputmode="decimal" data-f="price" value="${numVal(l.price)}" placeholder="${pricePh(l, s)}" aria-label="Betrag in Euro"></div>` : done}
    </div>`;
  }).join('');
  const name = cust(d.customerId)?.name || '?';
  openModal(`<div class="row" style="gap:14px">${avatar(name)}<div class="sp" style="min-width:0"><div class="sale-name">${esc(name)}</div>
    <div class="mute">${esc(batchLabel(b))} · ${d.status === 'sold' ? 'bereits abgeholt' : 'reserviert'}</div></div></div>
    ${d.note ? `<div class="sale-ordernote">${esc(d.note)}</div>` : ''}
    <div class="card" style="margin:14px 0 0;padding-block:4px">${lines || '<div class="empty">Keine Positionen.</div>'}</div>
    <div class="ticket"><span>${open ? 'Summe bisher' : 'Zu zahlen'}</span><b id="o_sum"></b></div>
    <div class="mute">${open ? 'Gewicht oben eintragen (bei mehreren Stück das Gewicht zusammen). Es wird sofort gespeichert – der Kunde kann auch später abholen.' : 'Alles gewogen – der Preis steht fest.'}
      ${!open && !m.editAll ? ' <button class="b sm" data-a="saleeditkg" style="margin-left:6px">Gewicht ändern</button>' : ''}</div>
    <div id="warn" hidden></div>
    <div class="row" style="margin-top:18px"><button class="b" data-a="saleedit">Bearbeiten</button><span class="sp"></span>
      ${open || m.editAll
        ? `<button class="b" data-a="close">Zurück</button><button class="b" data-a="handover">✓ Abgegeben</button><button class="b pri big" data-a="saveweights">Gewicht speichern</button>`
        : `<button class="b" data-a="close">Zurück</button><button class="b pri big" data-a="handover">✓ Abgegeben</button>`}</div>`);
  updateWarn();
}

function viewBestand() {
  const batches = [...S.batches].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (ui.batchId !== 'tk' && !batches.find(b => b.id === ui.batchId)) ui.batchId = batches[0]?.id || null;
  const tkLeft = freezer().reduce((a, x) => a + Math.max(0, x.left), 0);
  const chips = batches.map(b => `<button class="chip ${b.id === ui.batchId ? 'on' : ''}" data-a="batch" data-v="${b.id}">${esc(sp(b.speciesId).name)} · ${dateDE(b.date)}</button>`).join('');
  let html = `<div class="phead"><div><div class="eyebrow">Schlachttermine</div><h2>Bestand</h2></div></div>
    <div class="chips"><button class="chip tk ${ui.batchId === 'tk' ? 'on' : ''}" data-a="batch" data-v="tk">❄ Tiefkühler${tkLeft ? ' · ' + fmt(tkLeft) : ''}</button>${chips}<button class="chip add" data-a="newbatch">＋ Neuer Termin</button></div>`;
  if (ui.batchId === 'tk') return html + viewFreezer();
  const b = batchOf(ui.batchId);
  if (!b) return html + emptyBox('egg', 'Noch kein Schlachttermin angelegt.', '<div style="margin-top:14px"><button class="b pri" data-a="newbatch">Ersten Schlachttermin anlegen</button></div>');

  const s = sp(b.speciesId), c = calc(b);
  let nRes = 0, nSold = 0;
  b.orders.forEach(o => o.status === 'sold' ? nSold++ : nRes++);
  const nFrozen = Object.values(b.frozen || {}).reduce((a, v) => a + (+v || 0), 0);
  let kgTotal = 0, kgOpen = 0;
  b.orders.forEach(o => o.lines.forEach(l => { if (kgLine(l, s)) { kgTotal++; if (needsKg(l, s)) kgOpen++; } }));
  const tiles = s.products.map(p => {
    const a = c.avail[p.id], pr = c.per[p.id];
    const cls = a === null ? 'na' : a < 0 ? 'neg' : a === 0 ? 'zero' : 'ok';
    const num = a === null ? '–' : a;
    const meta = [pr.res ? fmt(pr.res) + ' res.' : '', pr.sold ? fmt(pr.sold) + ' abgeh.' : '', pr.frozen ? '❄ ' + fmt(pr.frozen) : ''].filter(Boolean).join(' · ');
    return `<div class="tile ${cls}">
      <span class="t-name">${esc(p.name)}</span>
      <span class="t-num">${num}${a !== null ? `<small>${a < 0 ? 'zu viel' : 'frei'}</small>` : ''}</span>
      <span class="t-sub">${meta || (p.price ? eur(p.price) + '/' + unitLabel(p) : '&nbsp;')}</span>
      ${a !== null ? `<div class="meter" title="${Math.round(c.util[p.id] * 100)} % verplant"><i style="width:${Math.min(100, Math.round(c.util[p.id] * 100))}%"></i></div>` : ''}
    </div>`;
  }).join('');
  const parts = s.parts.map(p => `<span class="part ${c.rem[p.id] < -1e-9 ? 'neg' : ''}">${esc(p.name)} <b>${fmt(c.rem[p.id])}</b> / ${fmt(c.total[p.id])}</span>`).join('');

  html += `<div class="card hero">
      <div><div class="eyebrow">${dateDE(b.date)}</div><h2>${esc(s.name)}</h2></div>
      <button class="b sm" data-a="editbatch">Bearbeiten</button>
      <div class="facts"><div><b>${b.count}</b><span>geschlachtet</span></div><div><b>${nRes}</b><span>reserviert</span></div><div><b>${nSold}</b><span>abgeholt</span></div>${nFrozen ? `<div><b>${fmt(nFrozen)}</b><span>eingefroren</span></div>` : ''}</div>
      ${b.note ? `<div class="mute" style="grid-column:1/-1">${esc(b.note)}</div>` : ''}
      <div class="row" style="grid-column:1/-1;margin-top:6px">${kgTotal ? `<button class="b sm ${kgOpen ? 'pri' : ''}" data-a="weigh">⚖ Gewichte eintragen · ${kgTotal - kgOpen}/${kgTotal}</button>` : ''}<button class="b sm" data-a="freeze">❄ ${nFrozen ? 'Eingefrorenes ändern' : 'Rest einfrieren'}</button></div>
    </div>
    <div class="tiles">${tiles}</div>
    <h3>Teile übrig</h3><div class="parts">${parts}</div>`;

  const orders = [...b.orders].sort((x, y) => (x.status === 'sold') - (y.status === 'sold'));
  html += `<div class="row" style="margin:26px 0 12px"><h3 style="margin:0">Bestellungen</h3><span class="sp"></span><button class="b pri" data-a="neworder">＋ Bestellung</button></div>`;
  if (!orders.length) html += emptyBox('basket', 'Noch keine Bestellungen für diesen Termin.');
  html += orders.map(o => {
    const name = cust(o.customerId)?.name || '?';
    return `<div class="card order" data-a="editorder" data-v="${o.id}">
      ${avatar(name)}
      <span class="name">${esc(name)}</span>
      <span class="right"><span class="sum">${money(orderVal(o, s))}</span><span class="tag ${o.status}">${o.status === 'sold' ? 'Abgeholt' : 'Reserviert'}</span></span>
      <span class="meta">${o.lines.length} Position${o.lines.length === 1 ? '' : 'en'}</span>
      <div class="items">${itemChips(o, s)}${o.note ? `<span class="ic note">${esc(o.note)}</span>` : ''}</div>
      ${o.status !== 'sold' ? `<div class="foot"><button class="b sm pri" data-a="pickup" data-v="${o.id}">✓ Abholen</button></div>` : ''}
    </div>`;
  }).join('');
  return html;
}

/* Tiefkühler: was aus allen Schlachtungen eingefroren wurde und noch da ist */
function viewFreezer() {
  const items = freezer().sort((a, b) => a.sp.name.localeCompare(b.sp.name, 'de') || a.p.name.localeCompare(b.p.name, 'de'));
  const intro = `<div class="card hero"><div><div class="eyebrow">Reste aus den Schlachtungen</div><h2>❄ Tiefkühler</h2></div>
    <div class="mute" style="grid-column:1/-1">Einfrieren geht beim jeweiligen Schlachttermin über „Rest einfrieren“. Tiefkühler-Ware kann in jeder Bestellung mitverkauft werden (Produktauswahl ganz unten). Was ihr selbst verbraucht, hier mit „Eigenverbrauch“ austragen.</div></div>`;
  if (!items.length) return intro + emptyBox('egg', 'Noch nichts eingefroren.');
  const bySp = {};
  items.forEach(x => (bySp[x.sp.name] ||= []).push(x));
  const groups = Object.entries(bySp).map(([name, xs]) => `<h3>${esc(name)}</h3><div class="tiles">${xs.map(x => {
    const cls = x.left < 0 ? 'neg' : x.left === 0 ? 'zero' : 'ok';
    const meta = [x.res ? fmt(x.res) + ' res.' : '', x.sold ? fmt(x.sold) + ' verkauft' : '', x.out ? fmt(x.out) + ' selbst' : ''].filter(Boolean).join(' · ');
    return `<div class="tile ${cls}"><span class="t-name">${esc(x.p.name)}</span>
      <span class="t-num">${fmt(x.left)}<small>da</small></span>
      <span class="t-sub">${fmt(x.in)} eingefroren${meta ? ' · ' + meta : ''}</span>
      ${x.left > 0 ? `<button class="b sm" style="margin-top:10px" data-a="tkout" data-v="${x.sid}|${x.pid}">Eigenverbrauch</button>` : ''}
    </div>`;
  }).join('')}</div>`).join('');
  const log = [...S.freezerOut].reverse().slice(0, 30).map(e => {
    const s = sp(e.speciesId), p = s?.products.find(x => x.id === e.productId);
    return `<tr><td>${dateDE(e.date)}</td><td>${esc(s ? s.name : '?')} ${esc(p ? p.name : '?')}</td><td class="n">${fmt(+e.qty || 0)}</td><td class="n"><button class="b sm dan" data-a="tkoutdel" data-v="${e.id}" aria-label="Eintrag löschen">✕</button></td></tr>`;
  }).join('');
  return intro + groups + (log ? `<h3>Eigenverbrauch</h3><div class="card scroll"><table><tr><th>Datum</th><th>Ware</th><th class="n">Stück</th><th></th></tr>${log}</table></div>` : '');
}
/* Nach dem Verpacken: alle Bestellungen eines Termins untereinander, Gewicht je Position eintragen.
   Gespeichert wird beim Verlassen eines Feldes; Preise und Summen rechnen sofort mit. */
function weighModal(batchId) {
  const b = batchOf(batchId), s = sp(b.speciesId);
  ui.modal = { type: 'weigh', batchId };
  const orders = [...b.orders].filter(o => o.lines.some(l => kgLine(l, s)))
    .sort((x, y) => (x.status === 'sold') - (y.status === 'sold') || (cust(x.customerId)?.name || '').localeCompare(cust(y.customerId)?.name || '', 'de'));
  const cards = orders.map(o => {
    const name = cust(o.customerId)?.name || '?';
    const rows = o.lines.map(l => `<div class="w-line">
        <div class="w-what"><b>${fmt(+l.qty || 0)}×</b> ${esc(lineName(l, s))}${noteText(l) ? ` <span class="sale-note">${esc(noteText(l))}</span>` : ''}</div>
        ${kgLine(l, s) ? `<input class="num" type="text" inputmode="decimal" data-wl="${o.id}|${l.id}" value="${kgVal(l.kg)}" placeholder="kg" aria-label="${esc(name)}: ${esc(lineName(l, s))} in kg">` : '<span></span>'}
        <span class="w-price" id="wp_${l.id}"></span>
      </div>`).join('');
    return `<div class="card w-order" id="wo_${o.id}"><div class="row" style="gap:12px;flex-wrap:nowrap">${avatar(name)}<b class="sp" style="font-size:19px">${esc(name)}</b>
      ${o.status === 'sold' ? '<span class="tag sold">Abgeholt</span>' : ''}<span class="w-sum" id="ws_${o.id}"></span></div>${rows}</div>`;
  }).join('');
  openModal(`<div class="eyebrow">${esc(batchLabel(b))}</div><h2>⚖ Gewichte eintragen</h2>
    <div class="mute" style="margin:6px 0 4px">Gewicht der verpackten Ware je Position in kg. Mehrere Pakete mit „+“: <b>0,41+0,39+0,44</b>. Wird automatisch gespeichert.</div>
    <div class="w-progress" id="w_prog"></div>
    ${cards || emptyBox('basket', 'Keine Bestellungen mit Ware nach Gewicht.')}
    <div class="row" style="margin-top:14px"><span class="sp"></span><button class="b pri big" data-a="close">Fertig</button></div>`);
  updateWeigh();
}
function updateWeigh() {
  const m = ui.modal; if (!m || m.type !== 'weigh') return;
  const b = batchOf(m.batchId), s = sp(b.speciesId);
  let total = 0, open = 0;
  b.orders.forEach(o => {
    o.lines.forEach(l => {
      if (kgLine(l, s)) { total++; if (needsKg(l, s)) open++; }
      const el = $('wp_' + l.id); if (!el) return;
      const lv = lineVal(l, s);
      el.textContent = lv.none ? '' : (lv.est ? '≈ ' : '') + eur(lv.v);
      el.classList.toggle('est', lv.est);
    });
    const ws = $('ws_' + o.id); if (ws) ws.textContent = money(orderVal(o, s));
    const card = $('wo_' + o.id); if (card) card.classList.toggle('done', !o.lines.some(l => needsKg(l, s)));
  });
  $('w_prog').innerHTML = `<div class="meter"><i style="width:${total ? Math.round((total - open) / total * 100) : 100}%"></i></div><span>${total - open} von ${total} Positionen gewogen</span>`;
}

function freezeModal(b) {
  const s = sp(b.speciesId), c = calc(b, b.orders, {});
  const rows = s.products.filter(p => c.avail[p.id] !== null).map(p => {
    const cur = +(b.frozen || {})[p.id] || 0;
    return `<div class="line row" style="flex-wrap:nowrap"><div class="sp" style="min-width:0"><b>${esc(p.name)}</b><div class="mute">ohne Einfrieren frei: ${fmt(Math.max(0, c.avail[p.id]))}</div></div>
      <input class="num" style="width:96px;flex:none" type="text" inputmode="decimal" data-fz="${p.id}" value="${cur ? String(cur).replace('.', ',') : ''}" placeholder="0" aria-label="${esc(p.name)} einfrieren"></div>`;
  }).join('');
  ui.modal = { type: 'freeze', batchId: b.id };
  openModal(`<div class="eyebrow">${esc(batchLabel(b))}</div><h2>❄ Rest einfrieren</h2>
    <div class="mute" style="margin:6px 0 12px">Trag ein, wie viele Stück ihr von jedem Produkt eingefroren habt. Sie zählen dann nicht mehr als frei bei diesem Termin, sondern liegen im Tiefkühler.</div>
    ${rows}<div id="fzwarn"></div>
    <div class="row" style="margin-top:16px"><span class="sp"></span><button class="b" data-a="close">Abbrechen</button><button class="b pri" data-a="savefreeze">Speichern</button></div>`);
}
function readFreeze() {
  const fz = {};

function viewKunden() {

  S.batches.forEach(b => b.orders.forEach(o => {
    const x = stats[o.customerId] ||= { n: 0, sum: 0 };
    x.n++; if (o.status === 'sold') x.sum += orderVal(o, sp(b.speciesId)).v;
  }));
  const rows = [...S.customers].sort((a, b) => a.name.localeCompare(b.name, 'de')).map(c => {

      <td class="n"><button class="b sm" data-a="editcust" data-v="${c.id}">Ändern</button></td></tr>`;
  }).join('');
  return `<div class="phead"><div><div class="eyebrow">${S.customers.length} Kunden</div><h2>Stammkunden</h2></div><span class="sp"></span><button class="b pri" data-a="addcust">＋ Neuer Kunde</button></div>
  ${S.customers.length ? `<div class="card scroll"><table><tr><th>Name</th><th class="n">Bestell.</th><th class="n">Umsatz</th><th></th></tr>${rows}</table></div>` : emptyBox('kunden', 'Noch keine Kunden. Neue Kunden entstehen auch automatisch, wenn du bei einer Bestellung einen neuen Namen eintippst.')}`;
}

function viewUmsatz() {
  const years = [...new Set(S.batches.map(b => (b.date || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  const bs = S.batches.filter(b => ui.year === 'all' || (b.date || '').startsWith(ui.year));
  let sold = 0, soldEst = 0, open = 0, nOrders = 0, noPrice = 0, kgAll = 0;
  const animals = {}, byProd = {}, byCust = {}, byMonth = {}, byBatch = [];
  const weights = {};   // "Tierart · Produkt" -> [{b, kg, qty}] je Schlachtung, nur gewogene Stücke
  bs.forEach(b => {
    const s = sp(b.speciesId), c = calc(b);
    animals[s.name] = (animals[s.name] || 0) + b.count;
    /* Auslastung = das am stärksten verplante Teil (100 % heißt: davon ist nichts mehr frei) */
    const util = Math.max(0, ...Object.keys(c.total).map(k => c.total[k] ? c.used[k] / c.total[k] : 0));
    let bSold = 0, bOpen = 0, bPcs = 0, bKg = 0;
    b.orders.forEach(o => {
      const sum = orderVal(o, s).v, done = o.status === 'sold';
      if (done) {
        sold += sum; bSold += sum; nOrders++;
        const cu = cust(o.customerId)?.name || '?';
        byCust[cu] = (byCust[cu] || 0) + sum;
        const m = (b.date || '').slice(0, 7); byMonth[m] = (byMonth[m] || 0) + sum;
      } else { open += sum; bOpen += sum; }
      o.lines.forEach(l => {
        const p = prodOf(l, s);
        const key = p ? `${lineSp(l, s).name} ${p.name}${l.tk ? ' (Tiefkühler)' : ''}` : 'Sonderwünsche';
        const x = byProd[key] ||= { res: 0, done: 0, kg: 0, kgQty: 0, sum: 0 };
        const q = +l.qty || 0;
        if (!done) { x.res += q; return; }
        const lv = lineVal(l, s);
        x.done += q; x.sum += lv.v; bPcs += q;
        if (l.kg !== '' && l.kg != null) {
          x.kg += +l.kg; x.kgQty += q; bKg += +l.kg; kgAll += +l.kg;
          if (p && !l.tk && q) {

            let w = arr.find(e => e.b === b); if (!w) arr.push(w = { b, kg: 0, qty: 0 });
            w.kg += +l.kg; w.qty += q;
          }
        }
        if (lv.est) soldEst += lv.v;
        if (lv.none && p) noPrice++;
      });
    });
    const bFrozen = Object.values(b.frozen || {}).reduce((a, v) => a + (+v || 0), 0);
    byBatch.push({ b, s, bSold, bOpen, bPcs, bKg, util, bFrozen });

  const monthsObj = Object.fromEntries(Object.entries(byMonth).sort());

  /* Diagramme: gewogenes Gewicht je Schlachtung und Ø Stückgewicht je Produkt, in Datumsreihenfolge */
  const chrono = (a, b) => (a.b.date || '').localeCompare(b.b.date || '');

/* ---------- Diagramme (SVG, eine Reihe je Diagramm, Farben aus den Tokens) ---------- */
const shortDate = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) : '';
function axisTicks(lo, hi) {
  const step = [0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000].find(s => (hi - lo) / s <= 4) || 1000;
  const out = []; for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v * 1000) / 1000 || 0);
  return out;
}
function xLabels(pts, xAt, y) {
  const every = Math.ceil(pts.length / 6);
  return pts.map((p, i) => (i % every === 0 || i === pts.length - 1) ? `<text class="ax" x="${xAt(i)}" y="${y}" text-anchor="middle">${shortDate(p.x)}</text>` : '').join('');
}
function lineChart(pts) {
  const W = 320, H = 160, L = 42, R = 16, T = 18, B = 26;
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = Math.max((hi - lo) * 0.3, hi * 0.1, 0.02);
  lo = Math.max(0, lo - pad); hi += pad;
  const ticks = axisTicks(lo, hi); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const xAt = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const yAt = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const grid = ticks.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${yAt(v)}" y2="${yAt(v)}"/><text class="ax" x="${L - 6}" y="${yAt(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(p.v).toFixed(1)}`).join('');
  const last = pts.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(pts.map(p => p.tip).join('; '))}">${grid}
    ${pts.length > 1 ? `<path class="ln" d="${path}"/>` : ''}
    ${pts.map((p, i) => `<circle class="pt" cx="${xAt(i)}" cy="${yAt(p.v)}" r="4.5"/><circle class="hit" cx="${xAt(i)}" cy="${yAt(p.v)}" r="16" data-tip="${esc(p.tip)}"/>`).join('')}
    <text class="val" x="${Math.min(xAt(last), W - R - 4)}" y="${yAt(pts[last].v) - 10}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}">${fmt(pts[last].v)} kg</text>
    ${xLabels(pts, xAt, H - 6)}</svg>`;
}
function barChart(pts) {
  const W = 640, H = 170, L = 46, R = 10, T = 18, B = 26;
  const ticks = axisTicks(0, Math.max(...pts.map(p => p.v)) * 1.1); const hi = ticks[ticks.length - 1] || 1;
  const slot = (W - L - R) / pts.length, bw = Math.min(46, slot * 0.6);
  const xAt = i => L + slot * (i + 0.5);
  const yAt = v => T + (hi - v) / hi * (H - T - B);
  const grid = ticks.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${yAt(v)}" y2="${yAt(v)}"/><text class="ax" x="${L - 6}" y="${yAt(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  const bars = pts.map((p, i) => {
    const x = xAt(i) - bw / 2, y = yAt(p.v), h = yAt(0) - y, r = Math.min(4, h);
    return `<path class="br" d="M${x},${yAt(0)}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${yAt(0)}Z"/>
      <rect class="hit" x="${xAt(i) - slot / 2}" y="${T}" width="${slot}" height="${H - T - B}" data-tip="${esc(p.tip)}"/>`;
  }).join('');
  const maxI = pts.reduce((m, p, i) => p.v > pts[m].v ? i : m, 0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(pts.map(p => p.tip).join('; '))}">${grid}${bars}
    <text class="val" x="${xAt(maxI)}" y="${yAt(pts[maxI].v) - 6}" text-anchor="middle">${fmt(pts[maxI].v)} kg</text>
    ${xLabels(pts, xAt, H - 6)}</svg>`;
}
/* Tooltip: Maus darüber oder antippen */
function showTip(e) {
  const t = e.target.closest?.('[data-tip]'), tip = $('tip');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
}

    <div class="row" style="margin:10px 0 0"><span class="sp"></span><span>Summe: <b id="o_sum"></b></span></div>
    <label>Notiz zur Bestellung (optional)</label><input id="o_note" value="${esc(d.note || '')}">
    <div class="row" style="margin-top:18px">${m.isNew ? '' : '<button class="b dan" data-a="delorder">Löschen</button>'}<span class="sp"></span><button class="b" data-a="close">Abbrechen</button><button class="b pri" data-a="saveorder">Speichern</button></div>`);
  updateWarn();
}
/* Auswahl „Aus dem Tiefkühler“: alles, was noch drin ist (und die schon gewählte Ware) */
function tkOptions(l, s) {
  const items = freezer().filter(x => x.left > 0 || (l.tk === x.sid && l.productId === x.pid));
  if (!items.length) return '';
  return `<optgroup label="Aus dem Tiefkühler">${items.map(x => `<option value="tk|${x.sid}|${x.pid}" ${l.tk === x.sid && l.productId === x.pid ? 'selected' : ''}>❄ ${x.sid !== s.id ? esc(x.sp.name) + ' ' : ''}${esc(x.p.name)} (${fmt(x.left)} da)</option>`).join('')}</optgroup>`;
}
function updateWarn() {
  const m = ui.modal; if (!m || m.type !== 'order') return;
  const b = batchOf(m.batchId), s = sp(b.speciesId);
  const orders = b.orders.filter(o => o.id !== m.d.id).concat({ ...m.d, status: 'res' });
  const c = calc(b, orders);
  const bad = s.parts.filter(p => c.rem[p.id] < -1e-9).map(p => `${p.name} (${fmt(c.rem[p.id])})`);
  freezer(m.d.id, m.d).forEach(x => { if (x.left < -1e-9 && m.d.lines.some(l => l.tk === x.sid && l.productId === x.pid)) bad.push(`❄ ${x.p.name} im Tiefkühler (${fmt(x.left)})`); });
  $('warn').innerHTML = bad.length ? `<div class="warn">⚠ Nicht genug da: ${bad.join(', ')}</div>` : '';
  const x = orderVal(m.d, s);
  $('o_sum').textContent = (x.est ? '≈ ' : '') + eur(x.v);
}
/* Platzhalter im Betragsfeld: berechneter Betrag, wenn nichts eingetragen ist */
function pricePh(l, s) {
  const x = lineVal({ ...l, price: '' }, s);
  return x.none ? '€' : (x.est ? '≈ ' : '') + eur(x.v);
}

/* ---------- Aktionen ---------- */
function resolveCustomer(name) {
  name = name.trim(); if (!name) return null;
  let c = S.customers.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!c) { c = { id: uid(), name }; S.customers.push(c); }
  return c.id;
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const countInUse = (spId, prodId) => S.batches.some(b => (b.speciesId === spId && (+(b.frozen || {})[prodId] || b.orders.some(o => o.lines.some(l => !l.tk && l.productId === prodId)))) || b.orders.some(o => o.lines.some(l => l.tk === spId && l.productId === prodId))) || S.freezerOut.some(e => e.speciesId === spId && e.productId === prodId);

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v, sid = t.dataset.s, pid = t.dataset.p;
  const stay = () => { save(); render(); };
  switch (a) {
    case 'tab': ui.tab = v; render(); window.scrollTo(0, 0); break;
    case 'batch': ui.batchId = v; render(); break;
    case 'year': ui.year = v; render(); break;
    case 'close': closeModal(); break;
    case 'newbatch': batchModal({ speciesId: S.species[0]?.id, date: today(), count: '', note: '' }); break;
    case 'editbatch': batchModal({ ...batchOf(ui.batchId) }); break;
    case 'savebatch': {
      const d = ui.modal.d, count = Math.round(parseNum($('m_count').value));
      if (!count) return await say('Bitte die Anzahl der geschlachteten Tiere eintragen.');
      d.speciesId = $('m_species').value; d.date = $('m_date').value || today(); d.count = count; d.note = $('m_note').value.trim();
      if (d.id) Object.assign(batchOf(d.id), { speciesId: d.speciesId, date: d.date, count: d.count, note: d.note });
      else { d.id = uid(); d.orders = []; S.batches.push(d); ui.batchId = d.id; }
      closeModal(); stay(); break;
    }
    case 'delbatch': {
      const b = batchOf(ui.modal.d.id);
      if (await sure(`Schlachttermin mit ${b.orders.length} Bestellung(en) wirklich löschen?`)) { S.batches = S.batches.filter(x => x !== b); closeModal(); stay(); }
      break;
    }
    case 'neworder': { const b = batchOf(ui.batchId); orderModal(b, { id: uid(), t: Date.now(), customerId: null, status: 'res', note: '', lines: [newLine(b)] }); break; }
    case 'migrate': { const x = localLeftovers(); if (x) mergeLocal(x.L); render(); break; }
    case 'droplocal':
      if (await sure('Die alten Daten auf diesem Gerät nicht übernehmen? Sie bleiben im Browser liegen, werden aber nicht mehr angezeigt.')) { try { localStorage.setItem(KEY + '-moved', '1'); } catch (e) {} render(); }
      break;
    case 'editorder': { const b = batchOf(ui.batchId); orderModal(b, b.orders.find(o => o.id === v)); break; }
    case 'pickup': saleSheet(ui.batchId, v); break;
    case 'freeze': freezeModal(batchOf(ui.batchId)); break;
    case 'savefreeze': {
      const b = batchOf(ui.modal.batchId), fz = readFreeze(), s = sp(b.speciesId), c = calc(b, b.orders, fz);
      const bad = s.parts.filter(p => c.rem[p.id] < -1e-9).map(p => p.name);
      if (bad.length) { $('fzwarn').innerHTML = `<div class="warn">So viel ist nicht übrig: ${esc(bad.join(', '))}. Bitte weniger eintragen.</div>`; break; }
      b.frozen = fz; closeModal(); stay(); break;
    }
    case 'tkout': {
      const [sid, pid] = v.split('|'), x = freezer().find(y => y.sid === sid && y.pid === pid);
      const n = await ask(`Wie viele ${x.p.name} (${x.sp.name}) habt ihr selbst aus dem Tiefkühler genommen? Noch da: ${fmt(x.left)}`, '1');
      const q = n === null ? 0 : parseNum(n);
      if (q > 0) { S.freezerOut.push({ id: uid(), date: today(), speciesId: sid, productId: pid, qty: q }); stay(); }
      break;
    }
    case 'tkoutdel':
      if (await sure('Diesen Eigenverbrauch-Eintrag löschen? Die Ware zählt dann wieder als im Tiefkühler.')) { S.freezerOut = S.freezerOut.filter(e => e.id !== v); stay(); }
      break;
    case 'sale': { const [bid, oid] = v.split(':'); saleSheet(bid, oid); break; }
    case 'salebatch': ui.saleBatch = v; render(); break;
    case 'saledone': ui.saleDone = !ui.saleDone; render(); break;
    case 'saleedit': ui.modal.sale = false; ui.modal.pickup = true; ui.modal.d.status = 'sold'; drawOrder(); break;
    case 'saleeditkg': ui.modal.editAll = true; drawOrder(); break;
    case 'saveweights': persistSale(); ui.modal.editAll = false; drawOrder(); break;
    case 'weigh': weighModal(ui.batchId); break;
    case 'handover': {
      const d = ui.modal.d, b = batchOf(ui.modal.batchId);
      d.status = 'sold';
      b.orders[b.orders.findIndex(o => o.id === d.id)] = d;
      ui.q = '';
      closeModal(); stay(); break;
    }
    case 'addline': { const b = batchOf(ui.modal.batchId); syncOrderHead(); ui.modal.d.lines.push(newLine(b)); drawOrder(); break; }
    case 'delline': syncOrderHead(); ui.modal.d.lines = ui.modal.d.lines.filter(l => l.id !== v); drawOrder(); break;
    case 'saveorder': {
      syncOrderHead();
      const d = ui.modal.d, b = batchOf(ui.modal.batchId), name = $('o_cust').value;
      if (!name.trim()) return await say('Bitte einen Kunden eintragen.');
      d.customerId = resolveCustomer(name);
      d.lines = d.lines.filter(l => (+l.qty || 0) > 0 || (l.productId === '' && l.text));
      const i = b.orders.findIndex(o => o.id === d.id);
      if (i >= 0) b.orders[i] = d; else b.orders.push(d);
      closeModal(); stay(); break;
    }
    case 'delorder': {
      if (await sure('Bestellung wirklich löschen?')) { const b = batchOf(ui.modal.batchId); b.orders = b.orders.filter(o => o.id !== ui.modal.d.id); closeModal(); stay(); }
      break;
    }
    case 'addcust': { const n = await ask('Name des neuen Kunden:'); if (n && n.trim()) { resolveCustomer(n); stay(); } break; }
    case 'editcust': {
      const c = cust(v), n = await ask('Name ändern (leer lassen zum Löschen):', c.name);
      if (n === null) break;
      if (!n.trim()) {
        if (S.batches.some(b => b.orders.some(o => o.customerId === c.id))) await say('Dieser Kunde hat Bestellungen und kann nicht gelöscht werden.');
        else S.customers = S.customers.filter(x => x !== c);
      } else c.name = n.trim();
      stay(); break;
    }
    /* Einstellungen */
    case 'addspecies': { const n = await ask('Name der Tierart (z. B. Ente):'); if (n && n.trim()) { S.species.push({ id: uid(), name: n.trim(), parts: [], products: [] }); stay(); } break; }
    case 'delspecies': {
      if (S.batches.some(b => b.speciesId === sid)) return await say('Zu dieser Tierart gibt es Schlachttermine. Erst diese löschen.');
      if (await sure('Tierart wirklich löschen?')) { S.species = S.species.filter(s => s.id !== sid); stay(); }
      break;
    }
    case 'addpart': { const n = await ask('Name des Teils (z. B. Rücken):'); if (n && n.trim()) { sp(sid).parts.push({ id: uid(), name: n.trim(), perAnimal: 1 }); stay(); } break; }
    case 'delpart': {
      if (!await sure('Teil wirklich löschen?')) break;
      const s = sp(sid); s.parts = s.parts.filter(p => p.id !== pid); s.products.forEach(p => delete p.uses[pid]); stay(); break;
    }
    case 'addprod': { const n = await ask('Name des Produkts (z. B. Rücken):'); if (n && n.trim()) { sp(sid).products.push({ id: uid(), name: n.trim(), uses: {}, price: 0, unit: 'kg', avgKg: 0 }); stay(); } break; }
    case 'delprod': {
      if (countInUse(sid, pid)) return await say('Dieses Produkt wird in Bestellungen verwendet und kann nicht gelöscht werden.');
      if (await sure('Produkt wirklich löschen?')) { const s = sp(sid); s.products = s.products.filter(p => p.id !== pid); stay(); }
      break;
    }
    case 'export': {
      const json = JSON.stringify(S);
      let copied = false;
      try { await navigator.clipboard.writeText(json); copied = true; } catch (err) {}
      download(`gefluegel-sicherung-${today()}.json`, json);
      await say(copied
        ? 'Die Sicherung wurde in die Zwischenablage kopiert. Füge sie z. B. in eine Notiz oder Mail an dich selbst ein. Falls ein Download startet, liegt sie zusätzlich als Datei vor.'
        : 'Falls kein Download gestartet ist: Kopieren war hier nicht erlaubt. Bitte die App über Safari „Zum Home-Bildschirm“ öffnen und dort sichern.');
      break;
    }
    case 'import': $('importFile').click(); break;
    case 'importtext': {
      const txt = await ask('Gesicherten Text hier einfügen:');
      if (txt) await importJSON(txt);
      break;
    }
    case 'reset':
      if (await sure('Wirklich ALLE Daten löschen?') && await sure('Sicher? Das kann nicht rückgängig gemacht werden.')) { S = seed(); ui.batchId = null; stay(); }
      break;
  }
});

/* Kopfdaten des offenen Bestell-Fensters in den Entwurf übernehmen, bevor neu gezeichnet wird */
function syncOrderHead() {
  const d = ui.modal.d;
  d.status = $('o_status').value; d.note = $('o_note').value;
  d._name = $('o_cust').value;
}

/* Eingaben in Bestell-Fenster */
$('modal').addEventListener('input', e => {
  const wl = e.target.dataset?.wl;
  if (wl && ui.modal?.type === 'weigh') {
    const [oid, lid] = wl.split('|'), o = batchOf(ui.modal.batchId).orders.find(x => x.id === oid), l = o?.lines.find(x => x.id === lid);
    if (l) { l.kg = parseKg(e.target.value); updateWeigh(); }
    return;
  }
  const t = e.target, row = t.closest('[data-l]');
  if (!row || !t.dataset.f || !ui.modal || ui.modal.type !== 'order') return;
  const l = ui.modal.d.lines.find(x => x.id === row.dataset.l), s = sp(batchOf(ui.modal.batchId).speciesId);
  if (['qty', 'kg', 'price'].includes(t.dataset.f)) {
    l[t.dataset.f] = t.dataset.f === 'kg' ? parseKg(t.value) : t.value.trim() === '' ? '' : parseNum(t.value);
    row.querySelector('[data-f=price]').placeholder = pricePh(l, s);
  } else if (t.type === 'checkbox') {
    l[t.dataset.f] = t.checked;
    row.querySelector('[data-f=price]').placeholder = pricePh(l, s);
  } else l[t.dataset.f] = t.value;
  updateWarn();
});
$('modal').addEventListener('change', e => {
  if (e.target.dataset?.wl) { save(); return; }
  if (ui.modal?.sale && ['kg', 'price'].includes(e.target.dataset?.f)) { persistSale(); return; }
  const t = e.target, row = t.closest('[data-l]');
  if (t.id === 'o_status') ui.modal.d.status = t.value;
  if (!row || t.dataset.f !== 'productId') return;
  syncOrderHead();
  const l = ui.modal.d.lines.find(x => x.id === row.dataset.l);
  if (t.value.startsWith('tk|')) { const [, sid, pid] = t.value.split('|'); l.tk = sid; l.productId = pid; }
  else { delete l.tk; l.productId = t.value; }
  drawOrder();
});
/* Beim Neuzeichnen den getippten Kundennamen behalten */
const _drawOrder = drawOrder;
drawOrder = function () {
  const name = ui.modal.d._name;
  _drawOrder();
  if (name !== undefined && $('o_cust')) $('o_cust').value = name;
};

/* Verkauf: Suche filtert die Liste, ohne neu zu zeichnen (Tastatur bleibt offen) */
$('app').addEventListener('input', e => { if (e.target.id === 'v_q') { ui.q = e.target.value; filterSale(); } });

/* Einstellungen: Änderungen speichern */
$('app').addEventListener('change', e => {
  const t = e.target, c = t.dataset.c; if (!c) return;
  const s = sp(t.dataset.s), p = s?.products.find(x => x.id === t.dataset.p), pt = s?.parts.find(x => x.id === t.dataset.p);
  if (c === 'marinade') S.marinade = parseNum(t.value);
  if (c === 'spname') s.name = t.value.trim() || s.name;
  if (c === 'partname') pt.name = t.value.trim() || pt.name;
  if (c === 'partper') pt.perAnimal = parseAmt(t.value);
  if (c === 'prodname') p.name = t.value.trim() || p.name;
  if (c === 'prodprice') p.price = parseNum(t.value);
  if (c === 'produnit') p.unit = t.value;
  if (c === 'prodavg') p.avgKg = parseNum(t.value);
  if (c === 'produse') { const v = parseAmt(t.value); if (v > 0) p.uses[t.dataset.pt] = v; else delete p.uses[t.dataset.pt]; }
  save(); render();
});

$('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => { e.target.value = ''; await importJSON(r.result); };
  r.readAsText(f);
});
async function importJSON(text) {
  let j;
  try { j = JSON.parse(text); if (!j.species || !j.batches || !j.customers) throw 0; }
  catch (err) { return say('Das ist keine gültige Sicherung.'); }
  if (await sure('Bestehende Daten auf diesem Gerät durch die Sicherung ersetzen?')) { S = normalize(j); ui.batchId = null; save(); render(); }
}

$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

$('app').addEventListener('pointerover', showTip);
$('app').addEventListener('click', showTip);
addEventListener('scroll', () => { $('tip').hidden = true; }, { passive: true });
$('app').addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { if (pendingRender) scheduleRender(); }, 0); });

render();
initSync();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
